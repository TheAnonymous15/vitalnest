<!DOCTYPE html>
<html>
<head>
    <title>Test Notification Service</title>
</head>
<body>
    <h1>Test Contact Form</h1>
    <form id="testForm">
        <input type="text" id="name" placeholder="Name" required><br><br>
        <input type="email" id="email" placeholder="Email" required><br><br>
        <textarea id="message" placeholder="Message" required></textarea><br><br>
        <button type="submit">Send Message</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            };

            document.getElementById('result').innerHTML = '<p>Sending...</p>';

            try {
                const response = await fetch('http://localhost:9033/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                document.getElementById('result').innerHTML =
                    '<pre>' + JSON.stringify(result, null, 2) + '</pre>';

                if (result.success) {
                    this.reset();
                }
            } catch (error) {
                document.getElementById('result').innerHTML =
                    '<p style="color:red">Error: ' + error.message + '</p>';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
